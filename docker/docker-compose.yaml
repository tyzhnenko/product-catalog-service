---
services:
  product-catalog-service:
    image: product-catalog-service:latest
    build:
      context: ..
      dockerfile: ./docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - APP_SETTINGS_FILE=/app/docker/settings.yaml
      - APP_INFO__TITLE=Product Catalog Service
      - APP_DB__HOST=mongodb
      - APP_DB__USER=${MONGO_APP_USERNAME:?MONGO_APP_USERNAME is required}
      - APP_DB__PASSWORD=${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
      - APP_DB__AUTH_SOURCE=product_catalog
      - APP_DB__PORT=27017
      - APP_DB__DATABASE=product_catalog
      - APP_AUTH__RW_X_API_KEY=${APP_RW_X_API_KEY:?APP_RW_X_API_KEY is required}
      - APP_AUTH__RO_X_API_KEY=${APP_RO_X_API_KEY:?APP_RO_X_API_KEY is required}
    volumes:
      - ./settings.yaml:/app/docker/settings.yaml:ro
    depends_on:
      - mongodb
    networks:
      - catalog_network

  mongodb:
    image: mongo:8.0.34
    environment:
      - MONGO_INITDB_ROOT_USERNAME=${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}
      - MONGO_INITDB_DATABASE=product_catalog
      - MONGO_APP_USERNAME=${MONGO_APP_USERNAME:?MONGO_APP_USERNAME is required}
      - MONGO_APP_PASSWORD=${MONGO_APP_PASSWORD:?MONGO_APP_PASSWORD is required}
    volumes:
      - mongo_data:/data/db
      - ./mongo-entrypoint/:/docker-entrypoint-initdb.d/:ro
    networks:
      - catalog_network

  mongo-express:
    image: mongo-express:1.0.2
    ports:
      - "127.0.0.1:8081:8081"
    environment:
      - ME_CONFIG_MONGODB_URL=mongodb://${MONGO_ROOT_USERNAME:?MONGO_ROOT_USERNAME is required}:${MONGO_ROOT_PASSWORD:?MONGO_ROOT_PASSWORD is required}@mongodb:27017
      - ME_CONFIG_BASICAUTH_USERNAME=${ME_BASICAUTH_USERNAME:?ME_BASICAUTH_USERNAME is required}
      - ME_CONFIG_BASICAUTH_PASSWORD=${ME_BASICAUTH_PASSWORD:?ME_BASICAUTH_PASSWORD is required}
      - ME_CONFIG_CONNECT_RETRIES=20
    depends_on:
      - mongodb
    networks:
      - catalog_network

volumes:
  mongo_data:

networks:
  catalog_network:
    driver: bridge
